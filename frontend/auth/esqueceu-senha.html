<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha | FluxMEI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel" aria-label="FluxMEI">
      <a class="brand-mark" href="../index.html" aria-label="FluxMEI">
        <span class="brand-symbol">F</span>
        <span>FluxMEI</span>
      </a>
      <div class="brand-copy">
        <p class="brand-kicker">Entrou, saiu, lucrou.</p>
        <h1>FluxMEI</h1>
        <p>O sistema financeiro inteligente para o seu MEI.</p>
      </div>
      <div class="brand-metrics" aria-hidden="true">
        <div>
          <span>Conta</span>
          <strong>Segura</strong>
        </div>
        <div>
          <span>Acesso</span>
          <strong>Rápido</strong>
        </div>
        <div>
          <span>Dados</span>
          <strong>Protegidos</strong>
        </div>
      </div>
    </section>

    <section class="form-panel">
      <div class="mobile-logo" aria-hidden="true">
        <span class="brand-symbol">F</span>
        <span>FluxMEI</span>
      </div>

      <form class="auth-card" data-auth-form="reset" novalidate>
        <div class="auth-heading">
          <p class="eyebrow">Recuperação de acesso</p>
          <h2>Esqueceu sua senha?</h2>
          <p>Digite seu email para recuperar sua senha.</p>
        </div>

        <div class="alert" data-form-alert role="status" aria-live="polite"></div>

        <label class="field">
          <span>Email</span>
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.75A2.75 2.75 0 0 1 6.75 4h10.5A2.75 2.75 0 0 1 20 6.75v10.5A2.75 2.75 0 0 1 17.25 20H6.75A2.75 2.75 0 0 1 4 17.25V6.75Zm2.75-1.25c-.36 0-.69.15-.92.39L12 11.1l6.17-5.21c-.23-.24-.56-.39-.92-.39H6.75Zm11.75 2.08-5.66 4.78a1.3 1.3 0 0 1-1.68 0L5.5 7.58v9.67c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25V7.58Z"/></svg>
            <input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required />
          </span>
          <small class="field-error"></small>
        </label>

        <button class="submit-btn" type="submit" data-default-text="Enviar link de recuperação" data-loading-text="Enviando...">
          Enviar link de recuperação
        </button>

        <p class="auth-switch">
          Lembrou sua senha?
          <a href="login.html">Entrar</a>
        </p>
      </form>
    </section>
  </main>
  <script src="/env.js"></script>
  <script src="auth.js"></script>
</body>
</html>
